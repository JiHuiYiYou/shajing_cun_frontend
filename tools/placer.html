<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沙井村 · 摆位</title>
<style>
:root{
  --paper:#e9dec4; --paper-lit:#f6eed9; --ink:#1e1a12; --ink-3:#6d6350;
  --seal:#a5311d; --rule:#c2b18d; --r:2px;
  --serif:"Noto Serif SC","Songti SC",SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:13px;overflow:hidden}
#bar{position:fixed;left:0;right:0;top:0;height:44px;z-index:10;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(246,238,217,.94);border-bottom:1px solid var(--rule)}
#bar b{font-family:var(--serif);font-size:15px;letter-spacing:3px;margin-right:6px}
button{font-family:var(--sans);font-size:12px;padding:6px 12px;cursor:pointer;
  background:var(--paper-lit);border:1px solid var(--rule);border-radius:var(--r);color:var(--ink)}
button:hover{border-color:var(--seal)}
button.on{background:var(--seal);border-color:var(--seal);color:#fff}
#stage{position:absolute;left:0;right:0;top:44px;bottom:0;overflow:hidden;cursor:grab}
#stage.drag{cursor:grabbing}
#bg{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto}
#markers{position:absolute;left:0;top:0;transform-origin:0 0}
.mk{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
  background:#a5311d;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.mk.sel{background:#1e1a12;width:17px;height:17px;margin:-8.5px 0 0 -8.5px}
.mk.lbl::after{content:attr(data-n);position:absolute;left:9px;top:-4px;font-size:9px;
  color:var(--ink);background:rgba(246,238,217,.9);padding:0 3px;white-space:nowrap;pointer-events:none}
.lbl.off .mk.lbl::after{display:none}
.pl{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:2px;
  border:2px solid #2e4a57;background:rgba(46,74,87,.18);cursor:pointer}
.pl.sel{background:var(--seal);border-color:var(--seal)}
.pr{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:#63753f;border:1.5px solid #fff;cursor:pointer}
.pr.sel{background:#1e1a12}
#side{position:fixed;right:0;top:44px;bottom:0;width:290px;z-index:9;
  background:rgba(246,238,217,.96);border-left:1px solid var(--rule);overflow:auto;padding:12px}
#side h3{font-family:var(--serif);font-size:14px;letter-spacing:2px;margin:0 0 8px}
#side label{display:block;font-size:11px;color:var(--ink-3);margin:8px 0 3px;letter-spacing:1px}
#side input{width:100%;padding:5px 7px;border:1px solid var(--rule);background:#fffdf6;
  font-family:var(--sans);font-size:12px}
#side .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#side .hint{font-size:11px;line-height:1.8;color:var(--ink-3);margin-top:10px;
  border-top:1px dotted var(--rule);padding-top:8px}
#side pre{font-size:10.5px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;
  background:rgba(255,255,255,.6);border:1px solid var(--rule-soft);padding:6px;margin-top:8px}
#tip{position:fixed;left:12px;bottom:10px;z-index:11;font-size:11px;color:var(--ink-3);
  background:rgba(246,238,217,.9);padding:5px 9px;border:1px solid var(--rule)}
</style>
</head>
<body>
<div id="bar">
  <b>沙井村 · 摆位</b>
  <button id="btnHouses">七十二户</button>
  <button id="btnPlaces">五处地点</button>
  <button id="btnProps">器物</button>
  <button id="btnCollide">碰撞盒</button>
  <button id="btnLabels">名字</button>
  <button id="btnAuto">沿街排户</button>
  <button id="btnExport">导出 sites.js</button>
  <button id="btnCopy">复制</button>
  <span id="info" style="margin-left:auto;color:var(--ink-3);font-size:11px"></span>
</div>
<div id="stage">
  <img id="bg" src="../assets/map/overview.jpg" alt="">
  <div id="markers"></div>
</div>
<div id="side">
  <h3 id="selTitle">未选中</h3>
  <div id="selBody"></div>
  <div class="row">
    <button id="btnDel">删除</button>
    <button id="btnCenter">移到画面中央</button>
  </div>
  <div class="hint">
    舆图是模型画的，屋子的位置由 <b>tools/mapgen/describe.py</b> 识别而来，
    认错了就在这里改。改完点「导出 sites.js」，
    把内容覆盖 <b>assets/js/sites.js</b> 即可。<br>
    滚轮缩放，拖动空白处平移，点标记选中，拖动标记改位。
  </div>
  <pre id="out"></pre>
</div>
<div id="tip">滚轮缩放 · 拖空白平移 · 点选标记</div>

<script>
/* 摆位编辑器：看图、认错、改位、导出。
   坐标一律世界像素（舆图主图 6144×4080）。 */
var SITE = null, SEL = null, MODE = 'houses', SHOWLABEL = true;
var SC = 1, OX = 0, OY = 0;   /* 缩放与平移 */
var stage = document.getElementById('stage'), bg = document.getElementById('bg'),
    markers = document.getElementById('markers'), info = document.getElementById('info');

fetch('../assets/js/sites.js').then(function (r) { return r.text(); }).then(function (t) {
  var m = t.match(/const SITES = (\{[\s\S]*?\});/);
  SITE = JSON.parse(m[1]);
  bg.width = SITE.world.w; bg.height = SITE.world.h;
  fit(); draw();
}).catch(function (e) {
  document.getElementById('out').textContent = '读不到 sites.js：' + e;
});

function fit() {
  var W = SITE.world.w, H = SITE.world.h;
  var s = Math.min(stage.clientWidth / W, stage.clientHeight / H);
  SC = s; OX = (stage.clientWidth - W * s) / 2; OY = (stage.clientHeight - H * s) / 2;
  paint();
}
function paint() {
  bg.style.transform = 'translate(' + OX + 'px,' + OY + 'px) scale(' + SC + ')';
  markers.style.transform = 'translate(' + OX + 'px,' + OY + 'px) scale(' + SC + ')';
}
function list() {
  if (MODE === 'houses') return SITE.houses.map(function (h) {
    return { x: h.x, y: h.y, d: h, cls: 'mk', t: h.no };
  });
  if (MODE === 'places') return SITE.places.map(function (p) {
    return { x: p.x, y: p.y, d: p, cls: 'pl', t: p.name };
  });
  if (MODE === 'props') return SITE.props.map(function (p) {
    return { x: p.x, y: p.y, d: p, cls: 'pr', t: p.name };
  });
  return SITE.colliders.map(function (c, i) {
    return { x: c.x + c.w / 2, y: c.y + c.h / 2, d: c, cls: 'pr', t: '撞' + i };
  });
}
function draw() {
  markers.innerHTML = '';
  var arr = list();
  arr.forEach(function (it, i) {
    var d = document.createElement('div');
    d.className = it.cls + (SHOWLABEL ? ' lbl' : '');
    d.style.left = it.x + 'px'; d.style.top = it.y + 'px';
    d.dataset.n = it.t;
    if (SEL && SEL.mode === MODE && SEL.i === i) d.classList.add('sel');
    if (MODE === 'colliders') {
      d.style.left = it.d.x + 'px'; d.style.top = it.d.y + 'px';
      d.style.width = it.d.w + 'px'; d.style.height = it.d.h + 'px';
      d.style.margin = '0'; d.style.borderRadius = '0';
    }
    d.addEventListener('pointerdown', function (ev) {
      ev.stopPropagation();
      SEL = { mode: MODE, i: i };
      showSel(it);
      startDrag(ev, it);
    });
    markers.appendChild(d);
  });
  info.textContent = '世界 ' + SITE.world.w + '×' + SITE.world.h + '　' +
    (MODE === 'colliders' ? '碰撞盒' : MODE === 'houses' ? '七十二户' : MODE === 'places' ? '五处地点' : '器物') +
    ' ' + arr.length + ' 处';
}
function showSel(it) {
  document.getElementById('selTitle').textContent = it.t;
  var b = document.getElementById('selBody');
  if (MODE === 'colliders') {
    b.innerHTML = '<label>碰撞框 x / y</label><input id="ix" value="' + it.d.x + '">' +
      '<input id="iy" value="' + it.d.y + '">' +
      '<label>宽 / 高</label><input id="iw" value="' + it.d.w + '">' +
      '<input id="ih" value="' + it.d.h + '">';
    ['ix', 'iy', 'iw', 'ih'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', function () {
        it.d.x = +document.getElementById('ix').value;
        it.d.y = +document.getElementById('iy').value;
        it.d.w = +document.getElementById('iw').value;
        it.d.h = +document.getElementById('ih').value;
        draw();
      });
    });
  } else {
    b.innerHTML = '<label>世界坐标 x / y</label>' +
      '<input id="ix" value="' + Math.round(it.x) + '"><input id="iy" value="' + Math.round(it.y) + '">';
    ['ix', 'iy'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', function () {
        var v = +document.getElementById(id).value;
        if (id === 'ix') it.x = v; else it.y = v;
        if (it.d && it.d.x !== undefined) { it.d.x = Math.round(it.x); it.d.y = Math.round(it.y); }
        draw();
      });
    });
  }
}
function startDrag(ev, it) {
  ev.preventDefault();
  var sx = ev.clientX, sy = ev.clientY, ox = it.x, oy = it.y;
  function mv(e) {
    it.x = ox + (e.clientX - sx) / SC;
    it.y = oy + (e.clientY - sy) / SC;
    if (it.d && it.d.x !== undefined) { it.d.x = Math.round(it.x); it.d.y = Math.round(it.y); }
    draw();
  }
  function up() {
    window.removeEventListener('pointermove', mv);
    window.removeEventListener('pointerup', up);
  }
  window.addEventListener('pointermove', mv);
  window.addEventListener('pointerup', up);
}
/* 平移 */
var panning = false, px = 0, py = 0;
stage.addEventListener('pointerdown', function (e) {
  if (e.target.closest('.mk,.pl,.pr')) return;
  panning = true; px = e.clientX; py = e.clientY; stage.classList.add('drag');
});
window.addEventListener('pointermove', function (e) {
  if (!panning) return;
  OX += e.clientX - px; OY += e.clientY - py; px = e.clientX; py = e.clientY; paint();
});
window.addEventListener('pointerup', function () { panning = false; stage.classList.remove('drag'); });
stage.addEventListener('wheel', function (e) {
  e.preventDefault();
  var r = stage.getBoundingClientRect();
  var mx = e.clientX - r.left, my = e.clientY - r.top;
  var k = e.deltaY > 0 ? 0.88 : 1.14;
  var ns = Math.max(0.05, Math.min(6, SC * k));
  OX = mx - (mx - OX) * (ns / SC);
  OY = my - (my - OY) * (ns / SC);
  SC = ns; paint();
}, { passive: false });

document.getElementById('btnHouses').onclick = function () { MODE = 'houses'; SEL = null; draw(); };
document.getElementById('btnPlaces').onclick = function () { MODE = 'places'; SEL = null; draw(); };
document.getElementById('btnProps').onclick = function () { MODE = 'props'; SEL = null; draw(); };
document.getElementById('btnCollide').onclick = function () { MODE = 'colliders'; SEL = null; draw(); };
document.getElementById('btnLabels').onclick = function () {
  SHOWLABEL = !SHOWLABEL;
  document.getElementById('btnLabels').classList.toggle('on', SHOWLABEL);
  document.body.classList.toggle('lbl.off', !SHOWLABEL);
  draw();
};
document.getElementById('btnDel').onclick = function () {
  if (!SEL) return;
  var arr = list();
  if (MODE === 'houses') SITE.houses.splice(SEL.i, 1);
  else if (MODE === 'places') SITE.places.splice(SEL.i, 1);
  else if (MODE === 'props') SITE.props.splice(SEL.i, 1);
  else SITE.colliders.splice(SEL.i, 1);
  SEL = null; draw();
};
document.getElementById('btnCenter').onclick = function () {
  if (!SEL) return;
  var it = list()[SEL.i];
  OX = stage.clientWidth / 2 - it.x * SC;
  OY = stage.clientHeight / 2 - it.y * SC;
  paint();
};
/* 沿主街排户：没位置的就顺着街口一路排下去 */
document.getElementById('btnAuto').onclick = function () {
  if (!SITE.street || !SITE.street.length) { alert('坐标表里没有 street（主街折线），排不了'); return; }
  var pts = SITE.street, n = SITE.houses.length, per = Math.max(1, Math.floor(pts.length / n));
  SITE.houses.forEach(function (h, i) {
    var p = pts[Math.min(pts.length - 1, i * per)];
    h.x = Math.round(p[0]); h.y = Math.round(p[1]);
  });
  draw();
};
function toJs() {
  var head = '/* ============================================================\n' +
    '   沙井村 · 舆图 — 世界坐标表\n' +
    '   （由 tools/placer.html 摆位后导出）\n' +
    '   坐标为世界像素（原点在舆图左上角）。\n' +
    '   ============================================================ */\n';
  return head + 'const SITES = ' + JSON.stringify(SITE, null, 1) + ';\n';
}
document.getElementById('btnExport').onclick = function () {
  document.getElementById('out').textContent = toJs();
};
document.getElementById('btnCopy').onclick = function () {
  var t = toJs();
  document.getElementById('out').textContent = t;
  if (navigator.clipboard) navigator.clipboard.writeText(t);
};
window.addEventListener('resize', fit);
</script>
</body>
</html>
