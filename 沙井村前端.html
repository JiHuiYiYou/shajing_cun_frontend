<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="沙井村舆图：民国沙井村七十二户人物、时令、经济与村务的交互式村志模拟。">
<title>沙井村 · 舆图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e9dec4'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23a5311d' stroke-width='2.5'/%3E%3Ctext x='16' y='23' font-size='17' fill='%23a5311d' text-anchor='middle' font-family='serif'%3E%E4%BA%95%3C/text%3E%3C/svg%3E">
<!-- 思源宋体 SC：自托管子集（OFL 1.1），仅含本页所用字形，两款共约 400 KB -->
<link rel="preload" href="assets/fonts/noto-serif-sc-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/noto-serif-sc-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/world.css">
</head>
<body>


<div class="grain"></div>
<div class="vignette"></div>

<!-- ===================== 幕 ===================== -->
<div class="boot" id="boot">
  <img class="bg" src="assets/shajing/village.jpg" alt="水墨沙井村全景">
  <div class="veil"></div>
  <div class="inner">
    <div class="t">
      <div class="stamp">井</div>
      <h1 id="bootTitle"></h1>
    </div>
    <div class="sub">民 国 沙 井 村 · 七 十 二 户 舆 图</div>
    <p class="note">
      据《沙井村72户人物信息归集表》照录人物、时令、经济与村务诸条。<br>
      每月一案，抉择关乎村款、人望与乡里嫌隙。岁末结算，验其成效。
    </p>
    <button class="go" id="bootGo">入 村</button>
    <button class="go alt" id="bootCont" hidden>续 前 月</button>
    <div class="hint">按 ENTER 亦可</div>
  </div>
</div>

<!-- ===================== 应用 ===================== -->
<div class="app">

  <header class="hud">
    <div class="brand">
      <div class="seal">井</div>
      <div class="wordmark">
        <b>沙井村</b>
        <small>七十二户 · 村落舆图</small>
      </div>
    </div>

    <div class="clock">
      <svg class="dial" id="dial" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <div class="clocktext">
        <span class="mn" id="mName">正月</span>
        <span class="yr" id="yearN">第 1 年</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div>
          <span class="lab">村 款</span>
          <span class="val"><span id="vMoney">100</span><i>元</i></span>
        </div>
        <span class="delta" id="dMoney"></span>
      </div>
      <div class="stat">
        <span class="lab">人 望</span>
        <div class="gaugewrap">
          <svg class="gauge g-moss" id="gRep" viewBox="0 0 44 44" aria-hidden="true">
            <path class="gt" d="M8.6 35.4 A20 20 0 1 1 35.4 35.4"/>
            <path class="gf" id="fRep" d="M8.6 35.4 A20 20 0 1 1 35.4 35.4"/>
          </svg>
          <b id="vRep">50</b>
        </div>
      </div>
      <div class="stat">
        <span class="lab">矛 盾</span>
        <div class="gaugewrap">
          <svg class="gauge g-seal" id="gClash" viewBox="0 0 44 44" aria-hidden="true">
            <path class="gt" d="M8.6 35.4 A20 20 0 1 1 35.4 35.4"/>
            <path class="gf" id="fClash" d="M8.6 35.4 A20 20 0 1 1 35.4 35.4"/>
          </svg>
          <b id="vClash">30</b>
        </div>
      </div>
    </div>

    <div class="hudbtns">
      <button class="hb" id="btnFind">寻 人</button>
      <button class="hb" id="btnReset">重 开</button>
    </div>
  </header>

  <div class="almanac">
    <div class="track"><div class="run" id="almanac"></div></div>
  </div>

  <main class="stage">
    <div class="mapwrap" id="mapwrap">

      <!-- 世界：唯一挂相机变换的一层 -->
      <div class="world" id="world">
        <img class="plate" id="plate" src="assets/map/overview.jpg" alt="沙井村舆图">
        <div class="layer" id="figLayer"></div>
        <div class="layer" id="actorLayer"></div>
      </div>

      <!-- 屏幕空间：名牌、提示、天气、前景、图签 -->
      <div class="layer tagLayer" id="tagLayer"></div>
      <div class="prompt" id="prompt"></div>
      <div class="season" id="season"></div>
      <canvas id="weather"></canvas>
      <img class="branch" src="assets/shajing/branch.png" alt="" aria-hidden="true">

      <svg class="cartouche" viewBox="0 0 252 84" aria-hidden="true">
        <rect x="1" y="1" width="250" height="82" rx="1"/>
        <rect x="1" y="1" width="250" height="82" rx="1" class="ctFrame"/>
        <text x="15" y="29" class="ctTitle">沙 井 村 舆 图</text>
        <text x="15" y="48" class="ctSub">七十二户 · 归集表照录</text>
        <g class="scale" transform="translate(15,59)">
          <rect x="0" y="0" width="26" height="5"/><rect x="26" y="0" width="26" height="5" class="alt"/>
          <rect x="52" y="0" width="26" height="5"/><rect x="78" y="0" width="26" height="5" class="alt"/>
          <text x="0" y="19" class="ctTiny">〇</text><text x="104" y="19" class="ctTiny">二里</text>
        </g>
        <g class="compass" transform="translate(217,35)">
          <circle r="19" class="ctRing"/>
          <path d="M0 -17 L5 0 L0 17 L-5 0 Z" class="ctNorth"/>
          <path d="M-14 0 L0 -5 L14 0 L0 5 Z" class="ctSouth"/>
          <text x="0" y="-24" class="ctTiny">北</text>
        </g>
      </svg>

      <div class="maptools ui" id="mapTools">
        <canvas id="minimap" width="240" height="160" title="舆图全览"></canvas>
        <div class="mtbtns">
          <button class="mt" id="btnZoomOut" title="缩小">−</button>
          <button class="mt" id="btnZoomIn" title="放大">＋</button>
          <button class="mt" id="btnClan" title="族属图例">族</button>
        </div>
      </div>

      <div class="worldtip" id="worldTip">正在铺展村图…</div>
    </div>

    <aside class="drawer off" id="drawer">
      <div class="dhead">
        <div class="dtitlerow">
          <h2>寻 人</h2>
          <span class="cnt" id="dCount">72 户</span>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="#4d4535" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          <input id="q" type="search" placeholder="查姓名 / 职业 / 族长" autocomplete="off">
        </div>
        <div class="chips" id="chips"></div>
        <div class="lgwrap">
          <h4 id="lgToggle">族 属 图 例 <em class="chev"></em></h4>
          <div class="lgbody" id="lgBody"></div>
        </div>
      </div>
      <div class="dlist" id="dlist"></div>
    </aside>
  </main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="wipe" id="wipe"><div class="band"></div><div class="big" id="wipeBig"></div><div class="rule"></div></div>
<div class="toast" id="toast"></div>



<script src="assets/js/data.js"></script>
<script src="assets/js/sites.js"></script>
<script src="assets/js/world.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
