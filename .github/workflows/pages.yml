name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不打断正在进行的那个
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 站点就是「根目录那个页面 + assets/」，没有构建步骤：
      # 页面文件名叫「沙井村前端.html」，GitHub Pages 要的是 index.html，搬个名。
      - name: 备好站点目录
        run: |
          mkdir -p _site
          cp "沙井村前端.html" _site/index.html
          cp -r assets _site/assets
          touch _site/.nojekyll
          du -sh _site
          ls -la _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
